<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css practice</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="Hero">
        <h2 class="Name">Reestar</h2>
        <a class="Hero_link">Home|</a><a class="Hero_link2">Recipe|</a><a class="Hero_link3">Contact</a>
    </nav>
    <div class="container">
    <div class="cards-wrapper">
        <div class="card">
            <img src="images.jpg" alt="food" class="food_images">
            <p>Exclusive thandoori chicken with healthy ingredients</p>
            <button class="btn">Order Now</button>
        </div>
        <div class="card">
            <img src="4imgs.jpg" alt="food" class="food_images">
            <p>Exclusive pancakes with tasty dips and healthy smoothies</p>
            <button class="btn">Order Now</button>
        </div>
        <div class="card">
            <img src="3imgs.avif" alt="food" class="food_images">
            <p>Exclusive thandoori chicken with healthy ingredients</p>
            <button class="btn">Order Now</button>
        </div>
        <div class="card">
            <img src="2imgs.jpg" alt="food" class="food_images">
            <p>Exclusive lovely chicken gravy with healthy ingredients</p>
            <button class="btn">Order Now</button>
        </div>
    </div>
</div>
    <div class="contact">
        <h2>Contact us</h2>
        <table>
            <tr>
                <td>Name</td>
                <td><input type="text" placeholder="Enter your name"></td>
            </tr>
            <tr>
                <td>Email</td>
                <td><input type="email" placeholder="Enter your email"></td>
            </tr>
            <tr>
                <td>Message</td>
                <td><textarea placeholder="Enter your message"></textarea></td>
            </tr>
        </table>
    </div>
</body>

</html>
